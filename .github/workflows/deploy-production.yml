name: Deploy Backend Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padlupp-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'padlup001/padluppcore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: padlupp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d padlupp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: padlupp_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: isolated-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_SSLMODE: disable
      DJANGO_SECRET_KEY: synthetic-isolated-ci-key-not-used-by-any-production-environment
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_NOTIFICATIONS_ENABLED: '0'
      FIREBASE_PUSH_ENABLED: '0'
      BETA_WAITLIST_ONLY: '0'
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Configure canonical source
        run: |
          set -euo pipefail
          git checkout -B main "$GITHUB_SHA"
          git remote add padlupp https://github.com/padlup001/padluppcore.git

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and WebSocket test dependencies
        # channels.testing imports Daphne; production continues to use Uvicorn.
        run: python -m pip install -r requirements.txt "channels[daphne]==4.3.2"

      - name: Verify deployment controller and application
        run: |
          set -euo pipefail
          python -m unittest deployment.automatic.test_controller -v
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput
          python manage.py migrate --noinput
          python manage.py safe_deploy_migrate --database-name=padlupp_ci

      - name: Package only tracked source
        id: package
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/padlupp-backend.XXXXXX")"
          git archive "$GITHUB_SHA" | tar -x -C "$stage"
          python - "$stage" <<'PY'
          import json, os, pathlib, sys
          stage = pathlib.Path(sys.argv[1])
          source = json.loads((stage / 'deployment-source.json').read_text())
          assert source == {'remote': 'padlupp', 'repository': 'https://github.com/padlup001/padluppcore.git', 'branch': 'main'}
          (stage / '.deployment-source.json').write_text(json.dumps({**source, 'commit': os.environ['GITHUB_SHA']}) + '\n')
          PY
          artifact="$RUNNER_TEMP/padlupp-backend-$GITHUB_SHA.tar.gz"
          tar -C "$stage" -czf "$artifact" .
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Deploy latest canonical main with verified backups
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          DEPLOY_HOST: ${{ secrets.PADLUPP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PADLUPP_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PADLUPP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PADLUPP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/padlup001/padluppcore/git/ref/heads/main --jq '.object.sha')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded backend commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!setting}" || { echo "::error::Missing production configuration: $setting"; exit 1; }
          done
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/padlupp-backend-key.XXXXXX")"
          known_file="$(mktemp "$RUNNER_TEMP/padlupp-backend-hosts.XXXXXX")"
          trap 'rm -f -- "$key_file" "$known_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$known_file"
          ssh -T -p 22 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_file" \
            -i "$key_file" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${GITHUB_SHA} ${SHA256}" < "$ARTIFACT"
          echo "Backend release $GITHUB_SHA passed backups, migration safety and production health checks." >> "$GITHUB_STEP_SUMMARY"
