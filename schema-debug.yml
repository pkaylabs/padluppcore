openapi: 3.0.3
info:
  title: PADLUPP API
  version: 1.0.0
  description: PADLUPP API
paths:
  /api-v1/auth/delete-account/:
    post:
      operationId: auth_delete_account_create
      description: Receive an account deletion request for the current user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/forgot-password/request-otp/:
    post:
      operationId: auth_forgot_password_request_otp_create
      description: 'Forgot password: request an OTP sent to the provided email.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestOtp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestOtp'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestOtp'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/forgot-password/reset-password/:
    post:
      operationId: auth_forgot_password_reset_password_create
      description: 'Forgot password: reset password using the reset token from OTP
        verification.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordResetPassword'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/forgot-password/verify-otp/:
    post:
      operationId: auth_forgot_password_verify_otp_create
      description: 'Forgot password: verify OTP and receive a reset token.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordVerifyOtp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordVerifyOtp'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordVerifyOtp'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordVerifyOtpResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/google-auth/:
    post:
      operationId: auth_google_auth_create
      description: Google auth (signup-or-signin). Verifies a Google `id_token`. If
        the user exists, returns 200 with a Knox token. Otherwise creates the user
        + Profile and returns 201.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/google-signin/:
    post:
      operationId: auth_google_signin_create
      description: Google sign-in. Verifies a Google `id_token`, logs the user in,
        and returns a Knox token. Fails if the user does not already exist.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/google-signup/:
    post:
      operationId: auth_google_signup_create
      description: Google sign-up. Verifies a Google `id_token`, creates a user if
        the email is unused, creates a Profile, and returns a Knox token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/invite/:
    post:
      operationId: auth_invite_create
      description: Invite someone to Padlupp by email. Sends an invite email with
        the signup link and adds the invitee to the waitlist so they can sign up during
        the beta.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteUserResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Login with email and password. Returns user info and token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api-v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout endpoint. Invalidates the token. Returns a detail message.
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api-v1/auth/user/:
    patch:
      operationId: auth_user_partial_update
      description: Patch update the current user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/auth/userprofile/:
    get:
      operationId: auth_userprofile_retrieve
      description: Get current user profile.
      tags:
      - auth
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api-v1/buddies/{id}/accept/:
    post:
      operationId: buddies_accept_create
      description: Accept a buddy request and create a partnership.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyRequestActionResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/buddies/{id}/reject/:
    post:
      operationId: buddies_reject_create
      description: Reject a buddy request.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyRequestActionResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/buddies/connect/:
    post:
      operationId: buddies_connect_create
      description: Send a buddy connection request to another user.
      tags:
      - buddies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuddyConnect'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuddyConnect'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuddyConnect'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/buddies/connections/:
    get:
      operationId: buddies_connections_list
      description: Return the current user's buddy connections as profiles.
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
          description: ''
  /api-v1/buddies/finder/:
    get:
      operationId: buddies_finder_list
      description: List profiles with similar experience and pending requests.
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuddyFinderProfile'
          description: ''
  /api-v1/buddies/invitations/:
    get:
      operationId: buddies_invitations_list
      description: List pending buddy requests sent to the current user.
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuddyRequest'
          description: ''
  /api-v1/buddies/profile/{user_id}/:
    get:
      operationId: buddies_profile_retrieve
      description: Get another user's buddy profile.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyProfileResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/buddies/search/:
    get:
      operationId: buddies_search_list
      description: Search within the current user's buddy connections by name. Splits
        `query` into words and matches if any word appears in the buddy's name.
      parameters:
      - in: query
        name: query
        schema:
          type: string
        description: Search text. Split into words; matches buddies where name contains
          any word.
        required: true
      tags:
      - buddies
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/conversations/:
    get:
      operationId: conversations_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - conversations
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
  /api-v1/conversations/{id}/:
    get:
      operationId: conversations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      tags:
      - conversations
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api-v1/conversations/{id}/media/:
    get:
      operationId: conversations_media_list
      description: List media attachments for a conversation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - conversations
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationMediaList'
          description: ''
  /api-v1/conversations/{id}/rename-group/:
    post:
      operationId: conversations_rename_group_create
      description: Rename a group conversation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRenameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationRenameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationRenameRequest'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api-v1/cron/checkin-reminders/:
    post:
      operationId: cron_checkin_reminders_create
      description: Send check-in reminders for goals whose cadence matches tomorrow.
      tags:
      - cron
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api-v1/cron/nudge-inactive-users/:
    post:
      operationId: cron_nudge_inactive_users_create
      description: |-
        Send nudges to users who have been inactive for a configurable threshold.

        This endpoint is intentionally unauthenticated so a cron job can call it directly.
        It is idempotent for a given user/inactivity span via InactivityNudgeLog.
      tags:
      - cron
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api-v1/events/:
    get:
      operationId: events_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - events
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventxList'
          description: ''
    post:
      operationId: events_create
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eventx'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Eventx'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Eventx'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventx'
          description: ''
  /api-v1/events/{id}/:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventx'
          description: ''
    put:
      operationId: events_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eventx'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Eventx'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Eventx'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventx'
          description: ''
    patch:
      operationId: events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventx'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventx'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventx'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventx'
          description: ''
    delete:
      operationId: events_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /api-v1/events/{id}/join/:
    post:
      operationId: events_join_create
      description: Join the event as a participant.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eventx'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Eventx'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Eventx'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventx'
          description: ''
  /api-v1/events/created/:
    get:
      operationId: events_created_list
      description: Get events created by the user.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - events
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
