  /api-v1/websockets/:
    get:
      operationId: websockets_retrieve
      description: |
        WebSocket channels (documentation-only).

        All WebSockets require `wss://` in production and authenticate using a Knox token passed as a query param: `?token=<token>`.

        ### Channels

        #### 1) Conversations list
        - URL: `wss://api.padlupp.com/ws/conversations/?token=<token>`
        - Server -> Client (initial):
          ```json
          {"type":"conversations","conversations":[{...}]}
          ```
        - Server -> Client (updates):
          ```json
          {"type":"conversation_update","conversation":{...}}
          ```

        Conversation payload shape:
        ```json
        {
          "id": 123,
          "partnership": 456,
          "goal": 789 | null,
          "is_group": true | false,
          "partner_name": "Alex",
          "partner_avatar": "https://api.padlupp.com/assets/avatars/...jpg" | null,
          "display_name": "Team Goal" | "Alex",
          "member_ids": [1,2,3],
          "member_names": ["Alex", "Sam"],
          "last_message": { ...MessageSerializer... } | null,
          "unread_count": 3,
          "created_at": "2026-02-04T12:34:56Z",
          "updated_at": "2026-02-04T12:40:00Z"
        }
        ```

        Notes:
        - Any `user.avatar` field returned by serializers is a full absolute URL (e.g. `https://api.padlupp.com/assets/avatars/...jpg`).

        #### 2) Chat (per conversation)
        - URL: `wss://api.padlupp.com/ws/chat/<conversation_id>/?token=<token>`

        On connect the server sends history:
        ```json
          {"type":"history","messages":[{...}]}
        ```

        On connect the server also sends a presence snapshot:
        ```json
          {"type":"presence","online_user_ids":[1,2]}
        ```

        Presence snapshot also includes last seen timestamps by user id:
        ```json
          {"type":"presence","online_user_ids":[1,2],"last_seen_at_by_user_id":{"1":"2026-05-08T12:00:00Z"}}
        ```

        Client -> Server messages:
        - Send message:
          ```json
          {"type":"message","text":"Hello"}
          ```
          - Optional reply: `reply_to_message_id`
        - Send image/video file (base64):
          ```json
          {"type":"file","filename":"pic.jpg","content_type":"image/jpeg","data":"<base64>","text":"optional caption","reply_to_message_id":123}
          ```
        - Send image/video file (binary frame, 2-step):
          1) Send metadata:
          ```json
          {"type":"file_meta","filename":"clip.mp4","content_type":"video/mp4","text":"optional caption","reply_to_message_id":123}
          ```
          2) Then send one binary websocket frame containing the raw file bytes.

        - Typing:
          ```json
          {"type":"typing","is_typing":true}
          ```
        - Delivered ack (after receiving a message):
          ```json
          {"type":"delivered","message_id":123}
          ```
        - Read receipts (optional):
          ```json
          {"type":"read","message_ids":[1,2,3]}
          ```
          ```json
          {"type":"read_all"}
          ```

        Server -> Client events (chat):
        - New message: the serialized message dict (backward-compatible)
        - Ack to sender: `{'type':'ack','ack':'received','message_id':<id>}`
        - Typing: `{'type':'typing','user_id':<id>,'user_name':<str>,'is_typing':<bool>}`
        - Presence: `{'type':'presence','online_user_ids':[...],'last_seen_at_by_user_id':{...}}`
          - Note: `online_user_ids` is conversation-scoped (only participants of this conversation who are currently connected to this conversation's chat socket).
          - `last_seen_at_by_user_id` maps participant ids to the latest known ISO timestamp.
        - Delivered: `{'type':'delivered','message_id':<id>,'by_user_id':<id>}`
        - Read: `{'type':'read','message_ids':[...],'by_user_id':<id>}`
        - Read all: `{'type':'read_all','by_user_id':<id>}`
      tags:
      - websockets
      security:
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
