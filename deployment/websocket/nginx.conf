# Nginx config for the Padlupp API and WebSocket server.

upstream padlupp_app_asgi {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.padlupp.com;
    client_max_body_size 30M;

    # Strip equivalent application headers before setting one canonical value
    # at the public edge, including for Nginx-generated error responses.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /static/ {
        alias /padlupp/padluppcore/staticfiles/;
    }

	# Check-in evidence is served only through an authenticated API endpoint.
	location ^~ /assets/checkin_evidence/ {
		return 404;
	}

    location /assets/ {
        alias /var/lib/padlupp/assets/;
    }

    # Browser WebSocket authentication currently uses a query parameter. Do
    # not persist those request URLs in the Nginx access log.
    location /ws/ {
        access_log off;
        proxy_pass http://padlupp_app_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cron endpoints are called directly over loopback by the server cron job.
    location ^~ /api-v1/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://padlupp_app_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://padlupp_app_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    ssl_certificate /etc/letsencrypt/live/api.padlupp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.padlupp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.padlupp.com;
    return 301 https://$host$request_uri;
}
